name: test

on:
  push:
    branches:
      - main
jobs:
  test:
    name: Testando projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18"
        run: | 
          gleam deps download
          gleam test
          gleam format --check src test
